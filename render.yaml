# Despliegue en Render: Web Service (página + API) y base de datos PostgreSQL.
# Crear con "New → Blueprint" eligiendo este repositorio.
databases:
  - name: brigada-db
    plan: free
    region: virginia
    databaseName: brigada
    user: brigada
    # Sin acceso desde internet: solo el servicio de Render se conecta.
    ipAllowList: []

services:
  - type: web
    name: brigada-abierta
    runtime: node
    plan: free
    region: virginia
    buildCommand: npm ci --omit=dev
    # Al iniciar aplica migraciones y datos iniciales (idempotente) y levanta el servidor.
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: brigada-db
          property: connectionString
      # sandbox = flujo de pago completo sin dinero real. Cambiar a live al integrar la pasarela.
      - key: PAYMENTS_MODE
        value: sandbox
      # true = carga cifras referenciales de ejemplo en una base nueva.
      - key: DEMO_DATA
        value: "true"
      # Secreto para verificar los webhooks de la pasarela (Render lo genera).
      - key: PAYMENT_WEBHOOK_SECRET
        generateValue: true
